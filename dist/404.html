<!doctype html>
<html lang="en" dir="ltr" data-theme="kit" data-mode="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>404 — Levain Kit</title>
    <meta name="description" content="Page not found">
    <meta name="theme-color" content="#f7f4ef">
    <meta name="color-scheme" content="light dark">
    <meta name="author" content="BLAblalba Studio">
    <meta property="og:type" content="website">
    <meta property="og:title" content="404 — Levain Kit">
    <meta property="og:description" content="Page not found">
    <meta property="og:locale" content="en_GB">
    
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="./index.html">
    <link rel="alternate" hreflang="en" href="./index.html">
    <link rel="alternate" hreflang="fr" href="./index.html?lang=fr">
    <link rel="alternate" hreflang="es" href="./index.html?lang=es">
    <link rel="alternate" hreflang="ar" href="./index.html?lang=ar">
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="./assets/site.webmanifest">
    
    <link rel="stylesheet" href="./assets/core.css">
    <link rel="stylesheet" href="./assets/hub.css">
    <script>
      // prevent theme/lang flash: read prefs before first paint
      try {
        var l = JSON.parse(localStorage.getItem('levain.lang') || 'null');
        var m = JSON.parse(localStorage.getItem('levain.mode') || 'null');
        if (m) document.documentElement.dataset.mode = m;
        if (l && ["en","fr","es","ar"].indexOf(l) > -1 && location.search.indexOf('lang=') < 0) {
          document.documentElement.lang = l;
          document.documentElement.dir = {"en":"ltr","fr":"ltr","es":"ltr","ar":"rtl"}[l];
        }
      } catch (e) {}
    </script>
  </head>
<main id="main" class="section" style="min-block-size:60vh;display:grid;place-items:center;text-align:center">
      <div class="wrap wrap--narrow stack" style="--flow:1rem">
        <p class="eyebrow">404</p>
        <h1 style="font-size:var(--fs-5)">This tray is empty.</h1>
        <p class="h-lead">The page you wanted is not in this build — the oven is fine, the link is not.</p>
        <p><a class="btn" href="./">Back to the kit</a></p>
      </div>
    </main>
    <script src="./assets/i18n.generated.js" defer></script>
    <script src="./assets/app.js" defer></script>
    <script src="./assets/hub.js" defer></script>
  </body>
</html>
